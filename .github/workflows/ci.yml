name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: marketpulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d marketpulse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: ci_test_user
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: marketpulse_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check .
      - name: Create dedicated test database
        run: >-
          PGPASSWORD="$POSTGRES_PASSWORD"
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          -c "CREATE DATABASE ${POSTGRES_DB}_test"
      - name: Apply migrations to test database
        run: alembic -x target=test upgrade head
      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend (Vitest, oxlint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run oxlint
        run: npm run lint
      - name: Run Vitest
        run: npm run test
      - name: Build
        run: npm run build
